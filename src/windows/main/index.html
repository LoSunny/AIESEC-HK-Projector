<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>AIESEC HK Controller</title></head>
<body>
<main class="browser">
    <div class="tab-strip">
        <div aria-label="Sources" id="screens" role="tablist"></div>
        <button aria-label="New tab" class="icon-button" id="new-tab" title="New tab (Ctrl/Cmd+T)">+</button>
    </div>
    <form class="navigation" id="navigation">
        <button aria-label="Back" class="icon-button" disabled id="back" title="Back" type="button">←</button>
        <button aria-label="Forward" class="icon-button" disabled id="forward" title="Forward" type="button">→</button>
        <button aria-label="Reload" class="icon-button" disabled id="reload" title="Reload" type="button">↻</button>
        <input aria-label="Search Google or enter a website address" autocomplete="off" id="url"
               placeholder="Search Google or enter a website address" spellcheck="false"
               type="text"/>
        <button class="go-button" id="open" type="submit">Go</button>
        <button aria-label="Settings" class="icon-button" id="settings" title="Settings" type="button">
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 3-1 2 2 3-2 1-3 3-1v-4l-3-1-1-3h-4Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </button>
    </form>
    <div class="tools">
        <div class="shortcuts">
            <button id="gdrive"><img alt="" src="../icons/gdrive.svg"/>Drive</button>
            <button id="yt"><img alt="" src="../icons/yt.svg"/>YouTube</button>
            <button id="spotify"><img alt="" src="../icons/spotify.svg"/>Spotify</button>
        </div>
        <span class="divider"></span>
        <button id="share">Share window</button>
        <button id="pdf">Open PDF</button>
        <div class="presentation"><span aria-live="polite" id="present-status">Presenting: Black screen</span>
            <button id="present">Present tab</button>
            <button aria-pressed="false" id="freeze">Freeze</button>
        </div>
    </div>
    <div id="win">
        <div id="empty">
            <div class="empty-icon">▣</div>
            <h1>Ready to present</h1>
            <p>Open a website, PDF, or shared window to get started.</p>
            <p>Select a tab to preview it, then choose <strong>Present tab</strong>.</p></div>
    </div>
</main>
</body>
</html>
